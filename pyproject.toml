[project]
name = "argsui"
version = "0.2.1"
description = "Library for turning dataclasses into argparser args and gui."
readme = "README.md"
authors = [
    { name = "McDougall", email = "Duncan.McDougall@rfi.ac.uk" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "pyside6>=6.11.0",
    "pytest-local-badge>=1.3.0",
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "icecream>=2.1.10",
    "pytest>=9.0.2",
    "line-profiler>=5.0.1",
    "pytest-autoprofile>=0.19.0",
    "pytest-cov>=7.0.0",
    "snakeviz>=2.2.2",
]

[tool.pytest]
testpaths = ["./tests", "./src/"]
addopts = [
    "--doctest-modules", 
    "--cov=./src/", 
    "--cov-report=html", 
    "--cov-branch", 
    "--local-badge-output-dir=badges",
    "--local-badge-package=argsui",
]

[tool.ruff]
indent-width=4

[tool.ruff.lint]
select=['E1', 'E4','E7','E9','F','N','ERA', 'ANN2', 'S', 'BLE', 'B', 'A', 'C4', 'COM', 'ISC', 'ICN', 'LOG', 'PIE','RET', 'SLF','SIM', 'TD', 'ARG', 'PTH', 'FLY', 'NPY', 'PERF', "D2", "TRY", "PT"]
ignore=["C408", "S311", "PTH123", "NPY002", "D203", "D205", "D212", "B006", "ARG001", "ARG002", "D200", "ANN204", "S101", "TRY003", 'RET504', 'COM812', 'PT012']

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ANN", "S101"]

[tool.bumpversion]
current_version = "0.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
push_tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
allow_dirty = false
commit = true
message = "Bump version to {new_version}: {distance_to_latest_tag} commits since {current_version}"
moveable_tags = []
commit_args = ''
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false
