name: tests + coverage

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests (with coverage + badges output)
        run: uv run pytest

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
          if-no-files-found: error

      - name: Upload badges artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: badges
          if-no-files-found: error

      - name: Publish badges to branch "badges"
        # avoid publish loop on PRs
        if: github.event_name == 'push'
        env:
          TARGET_BRANCH: badges
          FILES: |
            tests.svg
            skipped.svg
            coverage.svg
            last-run.svg
            argsui-requires-python.svg
            argsui-version.svg
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${TARGET_BRANCH}" || true

          git switch -C "${TARGET_BRANCH}"

          mkdir -p badges

          git add -A -f badges

          if git diff --cached --quiet; then
            echo "No badge changes to publish."
            exit 0
          fi

          git commit -m "Update badges"
          git push origin "${TARGET_BRANCH}"
