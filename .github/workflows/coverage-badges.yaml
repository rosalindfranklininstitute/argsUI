name: tests + coverage

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    if: (github.event_name == 'push') && (github.ref_name != 'badges')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: uv sync

      - name: Run tests (with coverage + badges output)
        run: |
          mkdir -p badges
          date
          uv run pytest
          date

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: htmlcov
          path: htmlcov
          if-no-files-found: error

      - name: Upload badges artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: badges
          path: badges
          if-no-files-found: error

      - name: Publish badges to branch "badges"
        env:
          TARGET_BRANCH: badges
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo " ----- "
          git switch -C "${TARGET_BRANCH}"
          git stash push
          git reset --hard main
          git stash pop

          git add -A -f badges

          if git diff --cached --quiet; then
            echo "No badge changes to publish."
            exit 0
          fi

          git commit -m "Update badges for "
          echo " ===== "
          git push --force origin "${TARGET_BRANCH}"
